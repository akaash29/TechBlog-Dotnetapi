name: CI

# Build + test only — there's no hosting target configured yet (no App
# Service, no cloud SQL Server, no real Blob Storage account), so this
# pipeline intentionally stops after a green test run. Add a deploy job
# once there's somewhere real to deploy to.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restoring/building from the test project pulls in the API project —
      # the only ProjectReference it has — so this single project is enough
      # to cover the whole solution; there's no .sln file in this repo.
      - name: Restore
        run: dotnet restore UserRegistration.IntegrationTests/UserRegistration.IntegrationTests.csproj

      - name: Build
        run: dotnet build UserRegistration.IntegrationTests/UserRegistration.IntegrationTests.csproj --no-restore --configuration Release

      # Integration tests boot the real API in-process against an isolated
      # SQLite in-memory database (see CustomWebApplicationFactory) and fake
      # out Azure Blob Storage / IP geolocation — no SQL Server, Azurite, or
      # internet access needed here.
      - name: Test
        run: >
          dotnet test UserRegistration.IntegrationTests/UserRegistration.IntegrationTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx
